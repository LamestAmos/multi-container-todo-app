services:
  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - /pg-data:/var/lib/postgresql

  redis:
    image: redis:8
    restart: always
    volumes:
      - /redis-data:/data

  api:
    build:
      context: .
    ports:
      - ${PORT}:3000
    depends_on:
      - db
      - redis

volumes:
  pg-data:
  redis-data:
